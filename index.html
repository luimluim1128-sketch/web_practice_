<!DOCTYPE html>
<html>
<head>
  <title>반응형 테스트 A</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
  <h1>반응형 웹 테스트</h1>
  <p>1. 이 페이지에는 viewport 메타 태그가 없습니다.
  스마트폰으로 열면 글자가 작게 보입니다.</p>
  <br>
  2. 이미지 불러오기<br>
  <img src="./cat.jpg" height="200px;" width="200px" alt="고양이"/>
 <br><br><br>
  3. ul TAG 사용법<br>
  <ul>
	<li>사과</li>
	<li>바나나</li>
	<li>원숭이</li>
  </ul>
  
  <br>
  4. table 사용법<br>
  <table border="1" width="90%">
	<tr><th align="left">이름</th><td>이름을 입력하세요</td><td rowspan="3">이름을 입력하세요</td><td>이름을 입력하세요</td></tr>
	<tr><th align="right">주소</th><td>이름을 입력하세요</td></tr>
	<tr><th>우편번호</th><td>이름을 입력하세요</td></tr>
  </table
  
 </body>
</html>
